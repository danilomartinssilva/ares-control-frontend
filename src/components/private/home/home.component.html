<div class="container-fluid">
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
    <p class="mt-2 text-muted">Carregando clientes...</p>
  </div>

  <div
    *ngIf="error && !loading"
    class="alert alert-danger alert-dismissible fade show"
    role="alert"
  >
    <strong>Erro!</strong> {{ error }}
    <button type="button" class="btn-close" (click)="error = ''"></button>
  </div>

  <div *ngIf="!loading">
    <div
      class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3"
    >
      <div class="d-none d-md-block" style="width: 250px"></div>

      <h2 class="mb-0 h4 h3-md text-center flex-grow-1">
        Gerenciamento de Clientes
      </h2>

      <button class="btn btn-primary btn-sm btn-md-normal" style="width: 250px" (click)="redirectToAddsUser()">
        <ng-icon name="ionCheckmarkCircle" class="me-2"></ng-icon>
        Cadastrar Novo Usuário
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-striped table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th class="d-none d-sm-table-cell">ID</th>
            <th>Name</th>
            <th class="d-none d-lg-table-cell">Email</th>
            <th class="d-none d-lg-table-cell">Phone</th>

            <th width="150" class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of usersSubscribers">
            <td class="d-none d-sm-table-cell">{{ user.id }}</td>
            <td>
              <div class="d-flex flex-column">
                <span class="fw-medium">{{ user.name }}</span>
                <small class="text-muted d-md-none">ID: {{ user.id }}</small>
                <small class="text-muted d-lg-none">{{ user.email }}</small>
                <small class="text-muted d-lg-none">{{ user.phone }}</small>
              </div>
            </td>

            <td class="d-none d-lg-table-cell">
              <span
                class="text-truncate d-inline-block"
                style="max-width: 300px"
                [title]="user.email"
              >
                {{ user.email }}
              </span>
            </td>
            <td class="d-none d-lg-table-cell">{{ user.phone }}</td>

            <td>
              <div class="d-flex flex-nowrap gap-1 justify-content-center">
                <button
                  class="btn btn-primary btn-sm btn-action"
                  title="Ver detalhes"
                >
                  <span class="d-none d-sm-inline">Detalhes</span>
                  <ng-icon name="ionEye" class="d-sm-none"></ng-icon>
                </button>

                <button
                  class="btn btn-info btn-sm btn-action"
                  title="Editar cliente"
                >
                  <span class="d-none d-sm-inline">Editar</span>
                  <ng-icon
                    name="ionCheckmarkCircle"
                    class="d-sm-none"
                  ></ng-icon>
                </button>

                <button
                  class="btn btn-danger btn-sm btn-action"
                  title="Excluir cliente"
                  (click)="callModalConfirmRemove(user)"
                >
                  <span class="d-none d-sm-inline">Excluir</span>
                  <ng-icon name="ionTrash" class="d-sm-none"></ng-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="usersSubscribers.length === 0" class="text-center py-5">
      <div class="py-4">
        <ng-icon
          name="ionPeople"
          class="text-muted"
          style="font-size: 48px"
        ></ng-icon>
        <p class="text-muted mt-2 mb-0">Nenhum usuario encontrado.</p>
        <button class="btn btn-primary mt-3"
        (click)="redirectToAddsUser()"
        >Cadastrar Primeiro Usuário</button>
      </div>
    </div>
  </div>
</div>
<app-modal-confirm></app-modal-confirm>
